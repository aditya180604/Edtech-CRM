<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="eduGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E04322" />
      <stop offset="35%" stop-color="#FA5A36" />
      <stop offset="70%" stop-color="#FF6E4A" />
      <stop offset="100%" stop-color="#FF8A65" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#C23315" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Coral Gradient Emblem Container -->
  <rect width="64" height="64" rx="16" fill="url(#eduGradient)" filter="url(#subtleGlow)" />

  <!-- Crisp White Concentric Sphere Emblem from EduLogo -->
  <g transform="translate(32, 32) scale(1.85) translate(-12, -12)">
    <!-- Outer Orbit Ring -->
    <path 
      d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="2.4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Inner Orbit Arc -->
    <path 
      d="M12 6a6 6 0 1 0 6 6" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="2.4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Core Nucleus Dot -->
    <circle cx="12" cy="12" r="2.1" fill="#FFFFFF" />
  </g>
</svg>